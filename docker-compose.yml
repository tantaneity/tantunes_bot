services:
  bot:
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - bot_data:/app/data

  worker:
    build: .
    env_file: .env
    command: arq bot.queue.worker.WorkerSettings
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - bot_data:/app/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  bot_data:
